name: Deploy nginx to Azure VM

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  APP_NAME: nginx
  APP_PORT: 80

jobs:
  provision:
    name: Provision Azure VM with Terraform
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.get_ip.outputs.server_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/deploy_key.pub

      - name: Write Terraform backend config
        run: |
          mkdir -p ${{ env.TF_WORKING_DIR }}
          cat > ${{ env.TF_WORKING_DIR }}/backend.tf <<EOF
          terraform {
            backend "azurerm" {
              resource_group_name  = "${{ secrets.TF_STATE_RESOURCE_GROUP }}"
              storage_account_name = "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
              container_name       = "${{ secrets.TF_STATE_CONTAINER }}"
              key                  = "${{ secrets.PROJECT_NAME }}/terraform.tfstate"
            }
          }
          EOF

      - name: Write Terraform main config
        run: |
          cat > ${{ env.TF_WORKING_DIR }}/main.tf <<'EOF'
          terraform {
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "~> 3.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }

          variable "public_key" {
            description = "SSH public key content"
            type        = string
          }

          variable "location" {
            description = "Azure region"
            type        = string
            default     = "East US"
          }

          variable "resource_group_name" {
            description = "Azure Resource Group name"
            type        = string
            default     = "udap-azure-rg"
          }

          variable "vm_size" {
            description = "Azure VM size"
            type        = string
            default     = "Standard_B1s"
          }

          resource "azurerm_resource_group" "main" {
            name     = var.resource_group_name
            location = var.location
          }

          resource "azurerm_virtual_network" "main" {
            name                = "udap-azure-vnet"
            address_space       = ["10.0.0.0/16"]
            location            = azurerm_resource_group.main.location
            resource_group_name = azurerm_resource_group.main.name
          }

          resource "azurerm_subnet" "main" {
            name                 = "udap-azure-subnet"
            resource_group_name  = azurerm_resource_group.main.name
            virtual_network_name = azurerm_virtual_network.main.name
            address_prefixes     = ["10.0.1.0/24"]
          }

          resource "azurerm_public_ip" "main" {
            name                = "udap-azure-pip"
            location            = azurerm_resource_group.main.location
            resource_group_name = azurerm_resource_group.main.name
            allocation_method   = "Static"
            sku                 = "Standard"
          }

          resource "azurerm_network_security_group" "main" {
            name                = "udap-azure-nsg"
            location            = azurerm_resource_group.main.location
            resource_group_name = azurerm_resource_group.main.name

            security_rule {
              name                       = "allow-ssh"
              priority                   = 1001
              direction                  = "Inbound"
              access                     = "Allow"
              protocol                   = "Tcp"
              source_port_range          = "*"
              destination_port_range     = "22"
              source_address_prefix      = "*"
              destination_address_prefix = "*"
            }

            security_rule {
              name                       = "allow-http"
              priority                   = 1002
              direction                  = "Inbound"
              access                     = "Allow"
              protocol                   = "Tcp"
              source_port_range          = "*"
              destination_port_range     = "80"
              source_address_prefix      = "*"
              destination_address_prefix = "*"
            }
          }

          resource "azurerm_network_interface" "main" {
            name                = "udap-azure-nic"
            location            = azurerm_resource_group.main.location
            resource_group_name = azurerm_resource_group.main.name

            ip_configuration {
              name                          = "internal"
              subnet_id                     = azurerm_subnet.main.id
              private_ip_address_allocation = "Dynamic"
              public_ip_address_id          = azurerm_public_ip.main.id
            }
          }

          resource "azurerm_network_interface_security_group_association" "main" {
            network_interface_id      = azurerm_network_interface.main.id
            network_security_group_id = azurerm_network_security_group.main.id
          }

          resource "azurerm_linux_virtual_machine" "main" {
            name                  = "udap-azure-vm"
            resource_group_name   = azurerm_resource_group.main.name
            location              = azurerm_resource_group.main.location
            size                  = var.vm_size
            admin_username        = "ubuntu"
            network_interface_ids = [azurerm_network_interface.main.id]

            admin_ssh_key {
              username   = "ubuntu"
              public_key = var.public_key
            }

            os_disk {
              caching              = "ReadWrite"
              storage_account_type = "Standard_LRS"
            }

            source_image_reference {
              publisher = "Canonical"
              offer     = "0001-com-ubuntu-server-jammy"
              sku       = "22_04-lts-gen2"
              version   = "latest"
            }
          }

          output "public_ip" {
            value = azurerm_public_ip.main.ip_address
          }
          EOF

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}